version: 2

updates:
    - package-ecosystem: uv
      directory: /
      schedule:
          interval: weekly
      # Propose a release only a week after it was published, the same window
      # this repo uses for its own upgrades. Security updates are not delayed.
      cooldown:
          default-days: 7

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
