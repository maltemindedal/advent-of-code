[project]
name = "advent-of-code"
version = "1.0.0"
description = "Multi-year Advent of Code solutions with Python and uv"
readme = "README.md"
authors = [{ name = "Malte Mindedal" }]
requires-python = ">=3.11"
dependencies = ["z3-solver>=4.12.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.6.0", "ty"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.rules]
all = "error"