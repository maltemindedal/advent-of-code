[project]
name = "advent-of-code"
version = "1.0.0"
description = "Multi-year Advent of Code solutions with Python and uv"
readme = "README.md"
authors = [{ name = "Malte Mindedal" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["z3-solver>=4.12.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.16.9", "ty>=0.0.84"]


[tool.pytest]
strict = true
filterwarnings = ["error"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = [
    "ANN", "B", "BLE", "C4", "E", "F", "I", "ISC", "PGH", "PIE",
    "PLE", "PLW", "PT", "PTH", "RUF", "S", "T10", "UP", "W",
]
# PLW2901: `line = line.strip()` inside a loop is this repo's parsing idiom.
ignore = ["PLW2901"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]  # plain asserts and seeded, non-cryptographic randomness

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.analysis]
# Only `# ty: ignore[rule]` suppresses; a bare `# type: ignore` would hide every diagnostic.
respect-type-ignore-comments = false

[tool.ty.rules]
all = "error"
